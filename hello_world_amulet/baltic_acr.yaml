# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# baltic01 with the TEAM ACR image instead of a platform image.
#
# Open question this answers: a multi-GB CUDA image staged from southafricanorth
# to eastus2 was still `queued` after 30 min and got cancelled, so it was never
# established whether it eventually runs. Same job, same target, left to finish.
description: Hello world on baltic01 using the team ACR image

target:
  service: manifold
  name: baltic01
  workspace_name: ai-frontiers-sa-ws

environment:
  registry: aifrontierssacr.azurecr.io
  image: nvidia25.11-pytorch2.10.0-te2.13-deepspeed0.18.9-fa2main-vllm0.18.0:20260415

code:
  local_dir: $CONFIG_DIR/src

jobs:
  - name: hello-baltic-acr
    priority: high
    sku: 80G1-H100
    command:
      - set -e -o pipefail
      - mkdir -p "$$AMLT_OUTPUT_DIR"
      - python hello.py --out_dir "$$AMLT_OUTPUT_DIR"
    submit_args:
      env:
        AZUREML_COMMON_RUNTIME_USE_SBOM_CAPABILITY: "false"
