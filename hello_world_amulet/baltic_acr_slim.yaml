# Amulet config file. Docs: https://amulet-docs.azurewebsites.net/config_file.html
# baltic01 using OUR OWN registry, with a small image.
#
# This is the config that proved cross-subscription ACR pulls are permitted:
# aifrontierssacr lives in ASG Azure ML / southafricanorth, baltic01 lives in
# Singularity Shared / eastus2, and a ~50 MB image from that registry pulled and
# ran on that cluster with no extra roles. Queue was ~10 min vs ~5 min for a
# platform image. Verified run recorded as job ":probe-acr-small".
#
# Use this shape when you need your own image on a far cluster and can keep it
# small. For a multi-GB image see baltic_acr.yaml.
description: Hello world on baltic01 using a small image from our own ACR

target:
  service: manifold
  name: baltic01
  workspace_name: ai-frontiers-sa-ws

environment:
  registry: aifrontierssacr.azurecr.io
  image: python3.12-slim-pybox:161225  # no torch — hello.py reports that and carries on

code:
  local_dir: $CONFIG_DIR/src

jobs:
  - name: hello-baltic-acr-slim
    priority: high
    sku: 80G1-H100
    command:
      - set -e -o pipefail
      - mkdir -p "$$AMLT_OUTPUT_DIR"
      - python hello.py --out_dir "$$AMLT_OUTPUT_DIR"
    submit_args:
      env:
        AZUREML_COMMON_RUNTIME_USE_SBOM_CAPABILITY: "false"
